services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    ipc: host
    shm_size: "16gb"
    command:
      - --model
      - ${VLLM_MODEL_NAME:-Qwen/Qwen3-14B-AWQ}
      - --served-model-name
      - ${VLLM_MODEL_NAME:-Qwen/Qwen3-14B-AWQ}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --quantization
      - ${VLLM_QUANTIZATION:-awq}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./model_cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build:
      context: .
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3002}:3002"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 3002
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_HOME: /app/model_cache/huggingface
      HF_HUB_CACHE: /app/model_cache/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      MODEL_SETTINGS_FILE: /app/model_cache/docker_model_settings.json
      SUMMARY_MODEL_NAME: ${VLLM_MODEL_NAME:-Qwen/Qwen3-14B-AWQ}
      SUMMARY_MAX_CHUNK_SIZE: ${SUMMARY_MAX_CHUNK_SIZE:-12000}
      SUMMARY_MAX_NEW_TOKENS: ${SUMMARY_MAX_NEW_TOKENS:-2500}
      LOCK_SERVICE_LLM_SETTINGS: "1"
      LLM_BACKEND: vllm
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME:-Qwen/Qwen3-14B-AWQ}
      VLLM_CONTEXT_WINDOW: ${VLLM_MAX_MODEL_LEN:-32768}
      VLLM_CHUNK_CONTEXT_RESERVE_TOKENS: ${VLLM_CHUNK_CONTEXT_RESERVE_TOKENS:-1024}
      VLLM_CONTEXT_RETRY_RESERVE_TOKENS: ${VLLM_CONTEXT_RETRY_RESERVE_TOKENS:-16}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-600}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-auto}
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-12}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-6}
      LIVE_TRANSCRIPTION_UPDATE_SECONDS: ${LIVE_TRANSCRIPTION_UPDATE_SECONDS:-5}
      BROWSER_CAPTURE_SEGMENT_MS: ${BROWSER_CAPTURE_SEGMENT_MS:-60000}
      DIARIZATION_MODEL_NAME: ${DIARIZATION_MODEL_NAME:-pyannote-community/speaker-diarization-community-1}
      PYANNOTE_METRICS_ENABLED: ${PYANNOTE_METRICS_ENABLED:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ./uploads:/app/uploads
      - ./output_files:/app/output_files
      - ./browser_capture_chunks:/app/browser_capture_chunks
      - ./logs:/app/logs
      - ./model_cache:/app/model_cache
